  $('sentence').innerHTML=
    '<span class="eyebrow">'+(mode==='chunks'?'Sentence Builder':'Listen &amp; Type')+' · '+item.speaker+'</span>'+
    '<div class="row between heading-row"><h2>Sentence '+(current+1)+' / '+n+'</h2><select id="goto" aria-label="Go to sentence">'+s.map((a,i)=>'<option value="'+i+'"'+(current===i?' selected':'')+'>Go to '+(i+1)+' · '+a.speaker+'</option>').join('')+'</select></div>'+
    '<div class="row" aria-label="Sentence exercise"><button data-action="chunks" aria-pressed="'+(mode==='chunks')+'">Build from chunks</button><button data-action="dictation" aria-pressed="'+(mode==='dictation')+'">Listen &amp; Type</button></div>'+
    '<div class="hint"><div class="row between"><strong class="eyebrow" style="margin:0">Vietnamese Hint</strong><button data-action="vi">'+(hint?'Hide':'Show')+'</button></div><p lang="vi" class="vi"'+(hint?'':' hidden')+'>'+esc(item.vi)+'</p></div>'+
    '<div class="row">'+(item.time?'<button data-action="listen">▶︎ Listen to sentence</button><button data-action="stop">■ Stop</button>'+speedControl():'<span class="quiet">Open Home for the full recording.</span>')+'</div>'+
    (mode==='chunks'?'<div class="chunk-area row" id="picked">'+(ex.picked.length?ex.picked.map(chunkButton).join(''):'<p class="quiet">Tap the chunks to build the original sentence.</p>')+'</div><div class="row chunk-bank" id="bank">'+ex.order.filter(i=>!ex.picked.includes(i)).map(chunkButton).join('')+'</div>':
    '<label><textarea id="typed" aria-label="Type the sentence" placeholder="Type what you hear.">'+esc(ex.typed)+'</textarea></label>')+
    '<div class="row"><button class="primary" data-action="check">Check</button><button data-action="hint">Hint</button><button data-action="clear">Clear</button><button data-action="answer">Show Answer</button></div>'+
    '<p class="feedback '+kind+'" role="status">'+esc(message)+'</p>'+
    '<div class="track" role="progressbar" aria-label="Sentences complete" aria-valuenow="'+count+'" aria-valuemax="'+n+'"><div style="width:'+count/n*100+'%"></div></div>'+
    '<div class="row between paging"><button data-action="prev"'+(current===0?' disabled':'')+'>← Prev</button><span>'+count+'/'+n+' complete</span><button data-action="next"'+(current===n-1?' disabled':'')+'>Next →</button><button data-action="reset">Reset</button></div>';
  $('goto').onchange=e=>moveSentence(+e.target.value);
  if($('typed'))$('typed').oninput=e=>ex.typed=e.target.value;
}
const normalized=v=>v.toLowerCase().replace(/[’‘]/g,"'").replace(/[-—–]/g,' ').replace(/[^a-z0-9' -]/g,'').replace(/\s+/g,' ').trim();
$('sentence').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const ex=exercises[current], item=s[current];
  if(b.dataset.chunk!==undefined){
    const i=+b.dataset.chunk;
    if(ex.picked.includes(i))ex.picked=ex.picked.filter(id=>id!==i);else ex.picked.push(i);
    renderSentence();
    const focus=document.querySelector((ex.picked.includes(i)?'#bank':'#picked')+' button');
    (focus||document.querySelector('[data-action=check]'))?.focus({preventScroll:true});return;
  }
  const act=b.dataset.action;
  if(act==='listen'){listen(current);return;}
  if(act==='stop'){stop();return;}
  if(act==='prev'||act==='next'){moveSentence(current+(act==='next'?1:-1));return;}
  if(act==='chunks'||act==='dictation'){stop();mode=act;renderSentence();return;}
  if(act==='vi'){hint=!hint;renderSentence();return;}
  if(act==='clear'){if(mode==='chunks'){ex.picked=[];ex.order=shuffle(ex.order);}else ex.typed='';renderSentence();return;}
  if(act==='reset'){stop();solved[mode].clear();for(const row of exercises){if(mode==='chunks'){row.picked=[];row.order=shuffle(row.order);}else row.typed='';}moveSentence(0);return;}
  if(act==='answer'){renderSentence(item.en);return;}
  if(act==='hint'){
    const i=ex.picked.findIndex((id,pos)=>id!==pos);
    const next=i<0?ex.picked.length:i;
    renderSentence(mode==='dictation'?'Starts with: '+item.chunks[0]:next<item.chunks.length?'Chunk '+(next+1)+': '+item.chunks[next]:'All chunks are in place.');
    return;
  }
  if(act==='check'){
    const correct=mode==='chunks'?ex.picked.length===item.chunks.length&&ex.picked.every((id,i)=>id===i):normalized(ex.typed)===normalized(item.en);
    if(correct)solved[mode].add(current);
    renderSentence(correct?'Correct!':mode==='chunks'?'The chunks do not yet match the original order.':'Your answer does not yet match the original sentence.',correct?'good':'bad');
  }
};
const shownCards=()=>cardOrder.filter(id=>!reviewOnly||status[id]==='review');
function renderCards(){
  const visible=shownCards();cardPos=Math.max(0,Math.min(cardPos,visible.length-1));
  const id=visible[cardPos],c=cards[id];
  const pill=(a,b,p)=>'<button data-action="'+a+'"'+(p===undefined?'':' aria-pressed="'+p+'"')+'>'+b+'</button>';
  const bar='<div class="row">'+pill('shuffle','Shuffle')+pill('filter','Needs review only',reviewOnly)+pill('reset','Reset')+'</div>';
  if(!c){$('cards').innerHTML='<h2>Review Cards</h2><p>No cards marked for review.</p>'+bar;return;}
  const item=s[c.idx], at=item.en.toLowerCase().indexOf(c.term.toLowerCase());
  const example=esc(item.en.slice(0,at))+'<strong>'+esc(item.en.slice(at,at+c.term.length))+'</strong>'+esc(item.en.slice(at+c.term.length));
  $('cards').innerHTML='<span class="eyebrow">Review Cards</span><div class="row between"><h2>Card '+(cardPos+1)+' / '+visible.length+'</h2>'+bar+'</div>'+
    '<article class="card"><span class="eyebrow">'+esc(c.kind)+'</span><div class="term">'+esc(c.term)+'</div>'+
    '<div class="row">'+pill('flip',flipped?'Hide meaning':'Show meaning',flipped)+(item.time?pill('listen','▶︎ Listen to sentence')+pill('stop','■ Stop')+speedControl():'')+'</div>'+
    (flipped?'<div class="details"><p class="ipa">'+esc(c.ipa)+'</p><p class="vi" lang="vi">'+esc(c.vi)+'</p><p>'+esc(c.pattern)+'</p></div><div class="example">'+example+'<p class="vi" lang="vi">'+esc(item.vi)+'</p></div>'+pill('source','Open source sentence'):'')+
    '</article><div class="row between paging"><button data-action="prev"'+(cardPos===0?' disabled':'')+'>← Previous</button><div class="row">'+pill('review','Needs review',status[id]==='review')+pill('known','Got it',status[id]==='known')+'</div><button data-action="next"'+(cardPos===visible.length-1?' disabled':'')+'>Next →</button></div>';
}
$('cards').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const act=b.dataset.action, id=shownCards()[cardPos],c=cards[id];
  if(act==='listen'){listen(c.idx);return;}
  if(act==='stop'){stop();return;}
  if(act==='flip'){flipped=!flipped;renderCards();return;}
  stop();flipped=false;
  if(act==='source'){current=c.idx;hint=true;changeView('sentence');return;}
  if(act==='prev')cardPos--;
  if(act==='next')cardPos++;
  if(act==='shuffle'){cardOrder=shuffle(cardOrder);cardPos=0;}
  if(act==='filter'){reviewOnly=!reviewOnly;cardPos=0;}
  if(act==='review'||act==='known')status[id]=act;
  if(act==='reset'){cardOrder=indexList(cards.length);cardPos=0;reviewOnly=false;status.fill('');}
  renderCards();
};
</script>
</body>
</html>
